name: Release Windows Packages

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Packages
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Create .env.local
        shell: pwsh
        run: |
          Set-Content -Path .env.local -Value @"
          VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY=${{ secrets.VITE_GOOGLE_API_KEY }}
          VITE_GOOGLE_CLIENT_APP=${{ secrets.VITE_GOOGLE_CLIENT_APP }}
          VITE_GOOGLE_CLIENT_SECRET=${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
          VITE_GOOGLE_CLIENT_ID_PROD=${{ secrets.VITE_GOOGLE_CLIENT_ID_PROD || secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY_PROD=${{ secrets.VITE_GOOGLE_API_KEY_PROD || secrets.VITE_GOOGLE_API_KEY }}
          VITE_ENVIRONMENT=production
          VITE_DROPBOX_CLIENT_ID=${{ secrets.VITE_DROPBOX_CLIENT_ID }}
          VITE_DROPBOX_CLIENT_SECRET=${{ secrets.VITE_DROPBOX_CLIENT_SECRET }}
          VITE_DROPBOX_CLIENT_ID_PROD=${{ secrets.VITE_DROPBOX_CLIENT_ID_PROD || secrets.VITE_DROPBOX_CLIENT_ID }}
          VITE_DROPBOX_CLIENT_SECRET_PROD=${{ secrets.VITE_DROPBOX_CLIENT_SECRET_PROD || secrets.VITE_DROPBOX_CLIENT_SECRET }}
          VITE_BOX_CLIENT_ID=${{ secrets.VITE_BOX_CLIENT_ID }}
          VITE_BOX_CLIENT_SECRET=${{ secrets.VITE_BOX_CLIENT_SECRET }}
          VITE_BOX_CLIENT_ID_PROD=${{ secrets.VITE_BOX_CLIENT_ID_PROD || secrets.VITE_BOX_CLIENT_ID }}
          VITE_BOX_CLIENT_SECRET_PROD=${{ secrets.VITE_BOX_CLIENT_SECRET_PROD || secrets.VITE_BOX_CLIENT_SECRET }}
          VITE_ONEDRIVE_CLIENT_ID=${{ secrets.VITE_ONEDRIVE_CLIENT_ID }}
          VITE_ONEDRIVE_CLIENT_SECRET=${{ secrets.VITE_ONEDRIVE_CLIENT_SECRET }}
          VITE_PREMIUM_AGENT=${{ secrets.VITE_PREMIUM_AGENT }}
          VITE_PREMIUM_MODEL=${{ secrets.VITE_PREMIUM_MODEL }}
          AGENT=${{ secrets.AGENT }}
          EASYAI_MODEL=${{ secrets.EASYAI_MODEL }}
          GEMINI_API=${{ secrets.GEMINI_API }}
          "@

      - name: Build Tauri application
        run: npm run tauri:build

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Rename portable executable
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          if (Test-Path "src-tauri/target/release/easyeditor.exe") {
            Copy-Item "src-tauri/target/release/easyeditor.exe" "src-tauri/target/release/easyeditor-portable_$version.exe"
            Write-Host "Created easyeditor-portable_$version.exe"
          }

      - name: List built artifacts
        shell: pwsh
        run: |
          Write-Host "Contents of src-tauri/target/release/bundle:"
          Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -Include "*.exe", "*.msi" | Select-Object Name, Length
          Write-Host "Contents of src-tauri/target/release:"
          Get-ChildItem -Path src-tauri/target/release -Include "easyeditor-portable_*.exe" | Select-Object Name, Length

      - name: Upload Windows packages to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/easyeditor-portable_*.exe
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
