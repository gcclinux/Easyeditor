name: easyeditor
version: '1.6.2'
summary: Easy Markdown Editor
description: |
  Easyeditor is a robust Markdown editor designed for developers and writers.
  It mimics a full Integrated Development Environment (IDE) experience for
  Markdown projects, featuring real-time preview, HTML/PDF export, and
  deep integration with version control systems.
  
  Key features include:
  - Real-time Markdown preview
  - Integration with Cloud Storage Services
  - Opening and editing files from arbitrary system locations
  - Export functionality to HTML, PDF, and TXT
  - SSTP Encryption support
  - Save and load .md files
  - Load Git repo and stage, commit, push and export to HTML, TXT, PDF & SSTP Encryption
  
  This application uses classic confinement because it's a Tauri-based application 
  requiring WebKitGTK 4.1 with full system access for file operations.

grade: stable
confinement: classic
icon: snap/gui/easyeditor.png
base: core24

title: Easyedit
license: MIT
contact: https://github.com/gcclinux/easyeditor/discussions
website: https://easyeditor.co.uk
source-code: https://github.com/gcclinux/easyeditor
issues: https://github.com/gcclinux/easyeditor/issues
donation: https://github.com/sponsors/gcclinux

platforms:
  amd64:

apps:
  easyeditor:
    command: bin/easyeditor
    desktop: snap/gui/easyeditor.desktop

parts:
  easyeditor:
    plugin: nil
    source: .
    override-build: |
      mkdir -p $SNAPCRAFT_PART_INSTALL/bin
      cp src-tauri/target/release/easyeditor $SNAPCRAFT_PART_INSTALL/bin/
      chmod +x $SNAPCRAFT_PART_INSTALL/bin/easyeditor
      mkdir -p $SNAPCRAFT_PART_INSTALL/snap/gui
      cp snap/gui/easyeditor.desktop $SNAPCRAFT_PART_INSTALL/snap/gui/
      cp snap/gui/easyeditor.png $SNAPCRAFT_PART_INSTALL/snap/gui/
