[package]
name = "easyeditor"
version = "1.6.6"
description = "Easy Markdown Editor"
authors = ["Ricardo Wagemaker <wagemra@gmail.com>"]
license = "MIT"
repository = "https://github.com/gcclinux/Easyeditor"
edition = "2021"
readme = "README.md"
include = ["src/**/*", "gen/**/*", "capabilities/**/*", "icons/**/*", "build.rs", "Cargo.toml", "tauri.conf.json", "README.md"]



[lib]
name = "easyeditor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
uuid = { version = "1.0", features = ["v4"] }
tauri-plugin-http = "2.5.5"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2.6"
