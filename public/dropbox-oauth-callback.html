<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dropbox Authentication</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .container {
      text-align: center;
      padding: 2rem;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .error {
      color: #ff6b6b;
      background: rgba(255, 255, 255, 0.9);
      padding: 1rem;
      border-radius: 8px;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h2>Connecting to Dropbox...</h2>
    <p>Please wait while we complete the authentication.</p>
    <div id="error" class="error" style="display: none;"></div>
  </div>

  <script>
    (function() {
      console.log('[Dropbox Callback] Starting OAuth callback processing');
      console.log('[Dropbox Callback] window.opener exists:', !!window.opener);
      console.log('[Dropbox Callback] window.location.origin:', window.location.origin);
      
      try {
        // Parse URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const error = urlParams.get('error');
        const errorDescription = urlParams.get('error_description');

        console.log('[Dropbox Callback] Parsed params:', { hasCode: !!code, hasError: !!error });

        if (error) {
          // Show error to user
          const errorDiv = document.getElementById('error');
          errorDiv.textContent = `Authentication failed: ${errorDescription || error}`;
          errorDiv.style.display = 'block';

          // Send error to parent window
          if (window.opener && !window.opener.closed) {
            console.log('[Dropbox Callback] Sending error to parent');
            window.opener.postMessage({
              type: 'dropbox_oauth_callback',
              error: errorDescription || error
            }, window.location.origin);
          } else {
            console.error('[Dropbox Callback] Parent window not available');
          }

          // Close window after 3 seconds
          setTimeout(() => {
            window.close();
          }, 3000);
          return;
        }

        if (code) {
          console.log('[Dropbox Callback] Authorization code received');
          console.log('[Dropbox Callback] Waiting for parent window to read the URL...');
          
          // Update UI to show success
          document.querySelector('h2').textContent = 'Authentication Successful!';
          document.querySelector('p').textContent = 'Completing authentication...';
          document.querySelector('.spinner').style.display = 'none';
          
          // Store the code in sessionStorage for parent to read
          // This works even when window.opener is null
          console.log('[Dropbox Callback] Storing code in sessionStorage for parent');
          sessionStorage.setItem('dropbox_oauth_code', code);
          sessionStorage.setItem('dropbox_oauth_timestamp', Date.now().toString());
          
          // Try to send message to parent (fallback method)
          if (window.opener && !window.opener.closed) {
            console.log('[Dropbox Callback] Sending code via window.opener.postMessage');
            try {
              window.opener.postMessage({
                type: 'dropbox_oauth_callback',
                code: code
              }, window.location.origin);
              console.log('[Dropbox Callback] Message sent successfully');
            } catch (err) {
              console.error('[Dropbox Callback] Failed to send message:', err);
            }
          } else {
            console.warn('[Dropbox Callback] window.opener not available, parent must read from sessionStorage');
          }
          
          // Close window after a short delay to ensure sessionStorage is written
          setTimeout(() => {
            console.log('[Dropbox Callback] Closing window');
            window.close();
          }, 1000);
        } else {
          throw new Error('No authorization code received from Dropbox.');
        }
      } catch (err) {
        console.error('OAuth callback error:', err);
        const errorDiv = document.getElementById('error');
        errorDiv.textContent = `Error: ${err.message}`;
        errorDiv.style.display = 'block';

        // Try to send error to parent
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage({
            type: 'dropbox_oauth_callback',
            error: err.message
          }, window.location.origin);
        }

        // Close window after 5 seconds
        setTimeout(() => {
          window.close();
        }, 5000);
      }
    })();
  </script>
</body>
</html>
